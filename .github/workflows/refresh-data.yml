name: Refresh real data release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data build dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Download official source packages
        run: python scripts/download_real_data.py
      - name: Build and validate compact release
        run: python scripts/build_real_data.py
      - name: Check release integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("client/public/data/manifest.json").read_text())
          assert manifest["mode"] == "real-source-release"
          assert manifest["integrity"]["syntheticRecords"] == 0
          assert manifest["counts"]["occupations"] > 900
          assert manifest["counts"]["taskStatementCount"] > 10000
          print("validated", manifest["releaseId"])
          PY
      - name: Commit updated release files
        run: |
          git config user.name "atlas-data-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data data/source-meta
          git diff --cached --quiet || git commit -m "chore: refresh official data release"
          git push

