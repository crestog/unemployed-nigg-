name: Deploy atlas to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare deployment configuration
        id: gate
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets."
          fi

      - name: Check out repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up pnpm
        if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.gate.outputs.ready == 'true'
        run: pnpm check

      - name: Lint
        if: steps.gate.outputs.ready == 'true'
        run: pnpm lint

      - name: Test
        if: steps.gate.outputs.ready == 'true'
        run: pnpm test

      - name: Build static assets
        if: steps.gate.outputs.ready == 'true'
        run: pnpm build

      # Migrations run only after a green build. Applying them first meant a
      # failing build left production D1 on a schema no deployed Worker used.
      - name: Apply Atlas D1 migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply atlas-roadmaps --remote --config wrangler.jsonc

      - name: Deploy Worker assets
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
