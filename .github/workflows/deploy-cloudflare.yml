name: Deploy atlas to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  # Not cancel-in-progress. The migration step below talks to production D1, and
  # killing wrangler between applying a migration and recording it in
  # d1_migrations leaves the database in a state the next run tries to re-apply.
  # Two quick pushes queue instead, which costs seconds.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare deployment configuration
        id: gate
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.repository_owner }}" == "crestog" ]]; then
            # A push to the deploying repository that cannot deploy is a failure,
            # not a skip. Every step here used to carry `if: ready == 'true'`, so a
            # rotated or expired token turned the whole job into a green no-op:
            # main advanced, the run showed a tick, and the live site stayed on an
            # older commit with nothing anywhere saying so.
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing or expired. Nothing was deployed; the live site is still serving the previous commit."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: this fork has no CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID. The verification steps below still run."
          fi

      # Verification is not gated on the deployment secrets. It needs none of
      # them, and its result is worth having on a fork and on a pull request.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The data release is committed, so it can be broken by a hand edit or a bad
      # merge without any build running. This is the only check that reads it.
      - name: Check data release integrity
        run: pnpm data:validate

      - name: Build static assets
        run: pnpm build

      # Migrations run only after a green build. Applying them first meant a
      # failing build left production D1 on a schema no deployed Worker used.
      - name: Apply Atlas D1 migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply atlas-roadmaps --remote --config wrangler.jsonc

      - name: Deploy Worker assets
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
