name: Refresh real data release

# A pushed commit authored by GITHUB_TOKEN does not trigger workflows — by
# design, so automation cannot loop. This job therefore used to leave refreshed
# data sitting on `main` with no deploy behind it: the release in git and the
# release being served drifted apart every month, silently.
#
# So it opens a pull request instead of pushing to `main`. That fixes the deploy
# loop the right way round — when a human merges, the merge is authored by them
# and `deploy-cloudflare.yml` runs — and it puts a review in front of a data diff
# that grows the repository every time it lands.
#
# Three of the six source packages cannot be fetched by a runner: the BLS serves
# an "Access Denied" page to automated retrieval — their stated usage policy
# prohibits bot activity, so this does not try to work around it — and the ILO's
# ISCO-08 workbook has no stable published URL. `data/raw/` is gitignored, so on a
# clean runner those three are simply absent and no complete release can be built.
#
# That precondition used to fail the job, which meant a red run and a failure
# notification every month for a documented, operator-blocked reason — the kind of
# alarm people learn to ignore, and it would have hidden the month the job broke
# for a real reason. So the download step now separates the two outcomes:
#
#   - a pinned URL that stopped serving, or a network failure, still fails red;
#   - the three unseeded packages stop the job cleanly, green, with a run summary
#     naming exactly which files to place and where.
#
# The monthly run therefore still earns its keep with the three seeded or not: it
# proves the O*NET, Census NAICS and UNSD ISIC URLs this repo pins are still
# serving. Seed the other three somewhere the runner can read and the same job
# starts producing pull requests with no change here.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data build dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Download official source packages
        id: download
        run: |
          set -uo pipefail
          # Exit 3 is the script's "everything fetchable was fetched, but a
          # human-supplied package is unseeded" signal. Anything else non-zero is
          # a real failure and is left to fail the step.
          status=0
          python scripts/download_real_data.py --tolerate-unseeded || status=$?
          case "$status" in
            0) echo "complete=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "complete=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Explain an unseeded source package in the run summary
        if: steps.download.outputs.complete == 'false'
        run: |
          {
            echo "### No release was built: a source package is unseeded"
            echo
            echo "The three machine-fetchable packages (O\*NET, Census NAICS, UNSD ISIC)"
            echo "were downloaded, so the URLs this repo pins are still serving. The other"
            echo "three are not fetchable — the BLS blocks automated retrieval and the"
            echo 'ILO workbook has no stable URL — and `data/raw/` is gitignored, so a'
            echo "clean runner starts without them."
            echo
            echo "The download step's log names each missing file, what it is, and the page"
            echo "to take it from. Seed those three where the runner can read them and this"
            echo "job will start proposing refreshes on its own."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and validate compact release
        if: steps.download.outputs.complete == 'true'
        run: python scripts/build_real_data.py
      - name: Check release integrity
        if: steps.download.outputs.complete == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("client/public/data/manifest.json").read_text())
          counts = manifest["counts"]
          assert manifest["mode"] == "real-source-release"
          assert manifest["integrity"]["syntheticRecords"] == 0
          assert counts["occupations"] > 900
          assert counts["taskStatementCount"] > 10000
          # The four assertions above all read O*NET-derived numbers, so a release
          # that silently lost the BLS wage/projection joins or the ISCO taxonomy
          # used to pass this gate looking healthy. These cover the rest.
          assert counts["occupationsWithBls"] > 900, counts["occupationsWithBls"]
          assert counts["occupationsWithBlsProjections"] > 900, counts["occupationsWithBlsProjections"]
          assert counts["isco"] > 500, counts["isco"]
          assert counts["naics"] > 2000, counts["naics"]
          assert counts["isic"] > 800, counts["isic"]
          print("validated", manifest["releaseId"], counts)
          PY

      - name: Commit updated release files
        id: commit
        if: steps.download.outputs.complete == 'true'
        run: |
          set -euo pipefail
          git config user.name "atlas-data-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add client/public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Source release is unchanged since the last refresh; nothing to propose."
            exit 0
          fi
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git commit -m "chore: refresh official data release"
          # Force, so re-running on the same day updates the open pull request
          # rather than failing on a branch that already exists.
          git push --force origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            echo "Pull request for $BRANCH already open; the force-push updated it."
            exit 0
          fi
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "chore: refresh official data release" \
            --body "$(cat <<'BODY'
          Automated monthly rebuild of the O*NET-derived release by
          `scripts/download_real_data.py` + `scripts/build_real_data.py`, validated
          against `client/public/data/manifest.json` (real-source mode, zero
          synthetic records, >900 occupations, >10,000 task statements).

          Worth a look before merging:

          - the `releaseId` and record counts in the manifest diff, and
          - how much the tracked data grew, since this lands in git permanently.

          Merging deploys: `deploy-cloudflare.yml` runs on push to `main`, which an
          automated push cannot trigger — that is why this is a pull request.
          BODY
          )"
