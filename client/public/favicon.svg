<?xml version="1.0" encoding="UTF-8"?>
<!-- Atlas mark: a graticule sphere. Kept to four shapes and two colours so it
     still reads as a globe at 16px, where thin meridian curves disappear. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#fbfaf5" />
  <circle cx="16" cy="16" r="11" fill="#0f766e" />
  <path d="M5 16h22" stroke="#fbfaf5" stroke-width="1.75" />
  <ellipse cx="16" cy="16" rx="4.75" ry="11" fill="none" stroke="#fbfaf5" stroke-width="1.75" />
  <circle cx="16" cy="16" r="2.25" fill="#c75b4a" />
</svg>
